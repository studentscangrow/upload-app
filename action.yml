name: Upload app to TdA
description: Build, push and upload your app to Tour de Cloud for the Tour de App competition
author: Student Cyber Games
branding:
  color: orange
  icon: server

inputs:
  tdc_token:
    description: Tour de Cloud team API token
    required: true
  api_url:
    description: Tour de Cloud API v2 base URL
    required: false
    default: https://tourde.cloud/api/v2
  config_path:
    description: Path to the Tour de Cloud application manifest
    required: false
    default: tourdeapp.yaml
  debug:
    description: Log API requests and responses
    required: false
    default: 'false'

outputs:
  upload_id:
    description: Identifier assigned by the upload preflight
  images:
    description: JSON array of successfully pushed image references
  deployable:
    description: Whether the completed upload is deployable

runs:
  using: node24
  main: dist/index.js
